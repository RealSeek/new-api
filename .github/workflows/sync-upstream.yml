name: Check Upstream Updates

on:
  schedule:
    # 每天北京时间凌晨 4:00 (UTC 20:00)
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch upstream
        run: git fetch https://github.com/QuantumNous/new-api.git main:refs/remotes/upstream/main

      - name: Report updates
        shell: bash
        run: |
          {
            echo '## new-api upstream updates'
            echo ''
            echo "Upstream: $(git rev-parse upstream/main)"
            echo "Pending commits: $(git rev-list --count HEAD..upstream/main)"
            echo ''
            echo 'Merge after checking RS Gateway channel 61, Task Plugin channel 64, task migrations, and billing regressions. See docs/upstream-sync-20261001.md.'
            echo ''
            git log --format='- %h %s' HEAD..upstream/main
          } >> "$GITHUB_STEP_SUMMARY"
